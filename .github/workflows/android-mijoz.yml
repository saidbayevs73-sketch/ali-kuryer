name: Android Ali Kuryer 4 APK
on:
  push:
    paths:
      - "android/mijoz/**"
      - ".github/workflows/android-mijoz.yml"
  pull_request:
    paths:
      - "android/mijoz/**"
      - ".github/workflows/android-mijoz.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: mijoz
            task: Mijoz
          - flavor: kuryer
            task: Kuryer
          - flavor: oshxona
            task: Oshxona
          - flavor: admin
            task: Admin
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android/mijoz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle --no-daemon app:assemble${{ matrix.task }}Debug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AliKuryer-${{ matrix.flavor }}-APK
          path: android/mijoz/app/build/outputs/apk/${{ matrix.flavor }}/debug/app-${{ matrix.flavor }}-debug.apk
          if-no-files-found: error
