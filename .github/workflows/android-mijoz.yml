name: Android Mijoz APK

on:
  push:
    paths:
      - "android/mijoz/**"
      - ".github/workflows/android-mijoz.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android/mijoz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AliKuryer-Mijoz-Debug-APK
          path: android/mijoz/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
