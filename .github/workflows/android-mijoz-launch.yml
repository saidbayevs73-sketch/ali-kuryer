name: Android Mijoz Launch Smoke Test

concurrency:
  group: customer-android-launch
  cancel-in-progress: true

on:
  push:
    paths:
      - "android/mijoz/**"
      - ".github/workflows/android-mijoz-launch.yml"
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: cd android/mijoz && gradle --no-daemon app:assembleMijozDebug app:assembleKuryerDebug app:assembleOshxonaDebug app:assembleAdminDebug
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app on emulator API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            for flavor in mijoz kuryer oshxona admin; do
              case "$flavor" in
                mijoz) package="uz.alikuryer.customer" ;;
                kuryer) package="uz.alikuryer.courier" ;;
                oshxona) package="uz.alikuryer.restaurant" ;;
                admin) package="uz.alikuryer.admin" ;;
              esac
              adb install -r "android/mijoz/app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
              adb logcat -c
              adb shell am start -n "$package/uz.alikuryer.customer.MainActivity"
              sleep 6
              adb exec-out screencap -p > "/tmp/ali-kuryer-$flavor.png"
              adb logcat -d -s AndroidRuntime:E > "/tmp/ali-kuryer-$flavor-runtime.log"
              if grep -E "FATAL EXCEPTION|Unable to start activity|Process: $package" "/tmp/ali-kuryer-$flavor-runtime.log"; then
                echo "$flavor CRASHED"
                exit 1
              fi
              if ! adb shell pidof "$package"; then
                echo "$flavor IS NOT RUNNING"
                exit 1
              fi
              echo "$flavor APP LAUNCH SUCCESS"
              adb shell am force-stop "$package"
            done
      - name: Upload Android runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ali-kuryer-startup-log
          path: /tmp/ali-kuryer-*-runtime.log
          if-no-files-found: ignore
      - name: Upload screenshot for Android 15 UI review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ali-kuryer-android15-screen
          path: /tmp/ali-kuryer-*.png
          if-no-files-found: ignore
