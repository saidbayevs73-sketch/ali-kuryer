name: Build Ali Kuryer APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK found at $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          fi
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Show Android signing fingerprints
        run: gradle --no-daemon :app:signingReport
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AliKuryer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
