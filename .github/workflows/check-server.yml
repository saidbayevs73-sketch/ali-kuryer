name: Ali Kuryer server checks

on:
  push:
    branches:
      - main
      - fix/**
      - feature/**
  pull_request:

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q main.py app scripts/migrate_legacy_to_postgres.py
      - name: Test application boot and health
        run: python -m pytest -q tests/test_render_startup.py tests/test_customer_experience.py tests/test_legacy_migration.py
      - name: Verify customer JavaScript syntax
        run: node --check site-assets/customer.js
