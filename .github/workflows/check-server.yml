name: Ali Kuryer server checks

on:
  push:
    branches:
      - main
      - fix/**
      - feature/**
  pull_request:

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q main.py app legacy_customer_api.py ali_kuryer.py scripts/migrate_legacy_to_postgres.py
      - name: Test application boot and health
        run: python -m pytest -q tests/test_render_startup.py tests/test_live_admin_recovery.py tests/test_customer_experience.py tests/test_legacy_migration.py tests/test_sms_otp.py tests/test_firebase_phone_auth.py tests/test_telegram_login.py tests/test_admin_dashboard.py tests/test_platform_control.py
      - name: Verify customer JavaScript syntax
        run: node --check site-assets/customer.js

      - name: Verify Super Admin JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path("app/admin_portal.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", source, flags=re.DOTALL)
          assert len(scripts) == 1 and "loginForm" in source
          Path("/tmp/ali_super_admin.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/ali_super_admin.js
