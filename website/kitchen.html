<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ali Kuryer — Oshxona</title><link rel="stylesheet" href="styles.css"><style>
.portal{max-width:640px;margin:48px auto;padding:0 18px}.portal-card{background:#fff;border:1px solid #e7e7e7;border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 8px 30px #1018280a}.portal h1{font-size:30px}.portal label{display:grid;gap:7px;font-weight:600;margin:14px 0}.portal input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #d7dbe2;border-radius:11px;font:inherit}.portal button{padding:13px 18px;border:0;border-radius:11px;background:#171717;color:white;font-weight:700;cursor:pointer}.portal button:disabled{opacity:.5}.portal-card{margin:18px 0}.portal input,.portal textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7dbe2;border-radius:10px;font:inherit}.staff-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #eee}.staff-info{display:grid;gap:5px}.staff-info small{color:#667085}.muted{color:#667085}#notice{padding:10px 0;color:#087443}#notice[data-state=error]{color:#b42318}
</style></head><body data-portal="kitchen"><header class="top"><a class="brand" href="index.html"><span class="brand-mark">A</span><span>ALI <b>KURYER</b></span></a><nav><a href="index.html">Mijozlar sayti</a><a href="admin.html">Admin</a><a href="courier.html">Kuryer</a></nav><span class="eyebrow">OSHXONA</span></header>
<main class="portal"><span class="eyebrow">XODIMLAR UCHUN</span><h1>Oshxona kabineti</h1><p class="muted">Bu yerda faqat administrator bergan login va parol bilan kirish mumkin. Ochiq ro‘yxatdan o‘tish mavjud emas.</p>
<section id="loginPanel" class="portal-card"><form id="staffLogin"><label>Login (email)<input id="staffEmail" type="email" required autocomplete="username" placeholder="Admin bergan login"></label><label>Parol<input id="staffPassword" type="password" required autocomplete="current-password" placeholder="Admin bergan parol"></label><button id="loginSubmit" type="submit">Kirish</button></form></section>
<section id="staffPanel" class="portal-card" hidden><h2 id="staffRole"></h2><p>Assalomu alaykum, <strong id="staffName"></strong></p>
<div id="kitchenSummary" class="muted"></div>
<form id="kitchenProfileForm"><h2>Oshxona profilini yaratish</h2><label>Oshxona nomi<input id="kName" required minlength="2"></label><label>Telefon<input id="kPhone" required></label><label>To‘liq manzil<input id="kAddress" required minlength="5"></label><label>Izoh<textarea id="kDescription"></textarea></label><button id="saveKitchenProfile">Profilni saqlash</button></form>
<form id="dishForm"><h2>Yangi taom qo‘shish</h2><label>Taom nomi<input id="dishName" required></label><label>Tavsif<input id="dishDescription"></label><label>Tarkibi<input id="dishIngredients"></label><label>Narxi (so‘m)<input id="dishPrice" type="number" min="0" required></label><button id="saveDish">Menyuga qo‘shish</button></form>
<h2>Mening menyum</h2><div id="dishList"></div><h2>Buyurtmalar</h2><button id="refreshKitchen" type="button">Yangilash</button><div id="kitchenOrderList"></div>
<button id="logout" type="button">Chiqish</button></section><p id="notice" role="status" aria-live="polite"></p></main><script type="module" src="staff-auth.js"></script><script src="kitchen-dashboard.js"></script></body></html>
