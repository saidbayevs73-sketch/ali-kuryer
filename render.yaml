services:
  - type: web
    name: ali-kuryer-new
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: ali-kuryer-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PRIVATE_UPLOAD_DIR
        value: /var/data/ali-kuryer-private
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/ali_kuryer.db
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMS_API_URL
        sync: false
      - key: SMS_API_TOKEN
        sync: false
      - key: AI_API_URL
        sync: false
      - key: AI_API_KEY
        sync: false
